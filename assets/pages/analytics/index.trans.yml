  storage: '%size% از مخاطب در پایگاه داده. روز به روز نگهداری می‌شود: افراد %human% ماه، ربات‌های مشکوک %suspect% ماه، ربات‌های اعلام شده %declared% ماه؛ ماه به ماه بعد از آن.'
  origin_intro: 'در سرور شمرده شده، بدون کوکی‌ها: یک بازدیدکننده فردا کسی دیگر است. موتورهای جستجو به ندرت کلمه کلیدی را منتقل می‌کنند.'
  robots_intro: 'هر ربات، جدا از افراد شمارش می‌شود: اعلام شده توسط عامل کاربری‌اش — خزنده‌ها، دستیارهای هوش مصنوعی —، یا مشکوک — عامل کاربری مرورگری بدون هدرهای مرورگر، که به صورت ناگهانی یا سریع‌تر از یک شخص می‌خواند. صفحات آن‌ها به تنهایی.'

