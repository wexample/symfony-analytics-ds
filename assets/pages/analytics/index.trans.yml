  origin_intro: 'سرور پر شمار کیے گئے، کوکیز کے بغیر: ایک زائر اگلے دن کوئی اور ہوتا ہے۔ تلاش کے انجن اب کم ہی کلیدواژه فراہم کرتے ہیں۔'
  robots_intro: 'ہر روبوٹ، لوگوں سے الگ شمار کیا جاتا ہے: اپنے صارف ایجنٹ کے ذریعہ اعلان کردہ — کھرچنے والے، AI معاون — یا مشکوک — بغیر براؤزر کے ہیڈرز کے براؤزر کا صارف ایجنٹ، جھپٹنے یا انسان سے تیز پڑھنے والا۔ صرف ان کے صفحات۔'

