  now_intro: 'هر صفحه‌ای که در ساعات گذشته خوانده شده، صرف‌نظر از دوره و مخاطب انتخاب شده در زیر.'
  now:
    window_24h: '۲۴ ساعت'
    window_2h: '۲ ساعت'
  composition_intro: 'هر صفحه‌ای که خوانده می‌شود، ترافیک خام: مردم، ربات‌هایی که به عنوان مرورگر لباس پوشیده‌اند و ربات‌هایی که خود را معرفی می‌کنند.'
  people_only: 'فقط افراد، هرچه که مخاطب انتخاب شده در بالا باشد.'
