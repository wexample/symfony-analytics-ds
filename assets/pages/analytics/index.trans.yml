en:
  page_title: Audience
  page_icon: ph:bold/chart-line-up
  section:
    traffic: Over time
    geography: Where visitors are
    origin: Where visits come from
    pages: Pages
    robots: Robots
  origin_intro: "Counted on the server, without cookies: a visitor is someone else the next day. Search engines rarely pass the keyword any more."
  robots_intro: "Crawlers and AI assistants, counted apart from the audience: pages read per robot, named by its user agent, or caught reading faster than a person."

fr:
  page_title: Audience
  page_icon: ph:bold/chart-line-up
  section:
    traffic: Dans le temps
    geography: Où sont les visiteurs
    origin: "D'où viennent les visites"
    pages: Pages
    robots: Robots
  origin_intro: "Compté côté serveur, sans cookie : un visiteur devient quelqu'un d'autre le lendemain. Les moteurs de recherche ne transmettent presque plus le mot-clé."
  robots_intro: "Moteurs et assistants IA, comptés à part de l'audience : pages lues par robot, nommé par son user agent, ou repéré à lire plus vite qu'une personne."

zh:
  page_title: 受众
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 随着时间的推移
    geography: 访客的来源
    origin: 访问来自哪里
    pages: 页面
    robots: 机器人
  origin_intro: '在服务器上计算，不使用 cookies：访客在第二天是另一个人。搜索引擎很少再传递关键词了。'
  robots_intro: 爬虫和人工智能助手，与观众分开计算：按机器人名称（由其用户代理命名）统计每个机器人阅读的页面数量，或者读取速度快于人的情况。

ar:
  page_title: الجمهور
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 'على مر الزمن'
    geography: 'من أين يأتي الزوار'
    origin: 'من أين تأتي الزيارات'
    pages: الصفحات
    robots: الروبوتات
  origin_intro: 'يتم العد على الخادم، بدون ملفات تعريف الارتباط: الزائر هو شخص آخر في اليوم التالي. نادرًا ما تمر محركات البحث بالكلمة الرئيسية بعد الآن.'
  robots_intro: 'العناكب ومساعدات الذكاء الاصطناعي، تُحسب بشكل منفصل عن الجمهور: الصفحات المقروءة لكل روبوت، مسماة بواسطة وكيل المستخدم الخاص بها، أو تم رصدها تقرأ بشكل أسرع من الشخص.'

hi:
  page_title: दर्शक
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 'समय के साथ'
    geography: 'जहाँ आगंतुक हैं'
    origin: 'जहाँ से विज़िट आते हैं'
    pages: पृष्ठ
    robots: रोबोट्स
  origin_intro: 'सर्वर पर गिने गए, बिना कुकीज़ के: एक आगंतुक अगले दिन कोई और होता है। सर्च इंजन अब अक्सर कीवर्ड पास नहीं करते।'
  robots_intro: 'क्रॉलर और एआई सहायक, दर्शकों से अलग गिने जाते हैं: प्रति रोबोट पढ़े गए पृष्ठ, जो इसके उपयोगकर्ता एजेंट द्वारा नामित होते हैं, या जो किसी व्यक्ति से तेज़ी से पढ़ते हुए पकड़े जाते हैं।'

he:
  page_title: קהל
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 'עם הזמן'
    geography: 'איפה המבקרים נמצאים'
    origin: 'מאיפה מגיעים הביקורים'
    pages: דפים
    robots: רובוטים
  origin_intro: 'נספר על השרת, בלי עוגיות: מבקר הוא מישהו אחר ביום למחרת. מנועי חיפוש rarely מעבירים את המילה המפתח עוד.'
  robots_intro: 'זוחלים ועוזרי AI, נחשבים בנפרד מהקהל: דפים שנקראו לכל רובוט, בשם סוכן המשתמש שלו, או נתפסים קוראים מהר יותר מאדם.'

fa:
  page_title: مخاطب
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 'در طول زمان'
    geography: 'مکان بازدیدکنندگان'
    origin: 'مکان ورود بازدیدها'
    pages: صفحات
    robots: ربات‌ها
  origin_intro: 'در سرور شمرده شده، بدون کوکی‌ها: یک بازدیدکننده فردا کسی دیگر است. موتورهای جستجو به ندرت کلمه کلیدی را منتقل می‌کنند.'
  robots_intro: 'زیرمجموعه‌ها و دستیارهای هوش مصنوعی، که از مخاطب جدا شمرده می‌شوند: صفحات خوانده شده به ازای هر ربات، که با شناسه کاربری‌اش نام‌گذاری شده‌اند، یا سریع‌تر از یک فرد در حال خواندن ضبط شده‌اند.'

ur:
  page_title: ناظرین
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 'وقت کے ساتھ'
    geography: 'زائرین کہاں ہیں'
    origin: 'ملاقاتیں کہاں سے آتی ہیں'
    pages: صفحات
    robots: روبوٹس
  origin_intro: 'سرور پر شمار کیے گئے، کوکیز کے بغیر: ایک زائر اگلے دن کوئی اور ہوتا ہے۔ تلاش کے انجن اب کم ہی کلیدواژه فراہم کرتے ہیں۔'
  robots_intro: 'کرالرز اور اے آئی اسسٹنٹس، سامعین سے الگ شمار کیے گئے: ہر روبوٹ کے لیے پڑھے گئے صفحات، جس کا نام اس کے صارف ایجنٹ کے ذریعے ہے، یا جو شخص سے زیادہ تیز پڑھتے ہوئے پکڑے گئے۔'

ja:
  page_title: オーディエンス
  page_icon: 'ph:bold/chart-line-up'
  section:
    traffic: 時間の経過とともに
    geography: 訪問者の所在地
    origin: 訪問がどこから来るか
    pages: ページ
    robots: ロボット
  origin_intro: 'サーバーでカウントされ、クッキーなし: 訪問者は翌日には別の人になります。検索エンジンはもはやキーワードを渡すことはほとんどありません。'
  robots_intro: クローラーやAIアシスタント。オーディエンスとは別にカウントされます：ロボットごとのページビュー、そのユーザーエージェントによる名称、または人より早く読み取られた場合。

ko:
