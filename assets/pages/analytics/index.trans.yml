  robots_intro: '크롤러와 AI 어시스턴트는 청중과 별개로 집계됩니다: 로봇별 페이지 수, 사용자 에이전트에 의해 명명되거나 사람보다 빠르게 읽고 있는 것으로 감지된.'

bn:
