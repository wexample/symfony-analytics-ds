  robots_intro: 'โปรแกรมรวบรวมข้อมูลและผู้ช่วย AI นับแยกจากผู้ชม: หน้าเว็บที่อ่านต่อหุ่นยนต์ โดยระบุจากตัวแทนผู้ใช้ หรือถูกจับได้ว่าอ่านเร็วกว่าใคร.'

