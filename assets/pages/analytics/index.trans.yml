en:
  page_title: Audience
  page_icon: ph:bold/chart-line-up
  section:
    now: Right now
    composition: Who reads the site
    traffic: Over time
    geography: Where visitors are
    origin: Where visits come from
    pages: Pages
    robots: Robots
    api: API
  api_intro: "The programs and MCP agents calling the api, counted apart from the readers: per route or tool, caller, status, and whether the cache answered."
  now_intro: "Every page read over the last hours, whatever the period and the audience chosen below."
  now:
    window_24h: 24 hours
    window_2h: 2 hours
  composition_intro: "Every page read, the raw traffic: the people, the robots caught dressed as browsers, and the robots naming themselves."
  people_only: "The people only, whatever the audience chosen above."
  geography_intro: "The map counts every page read, robots in; the table beside it, the audience chosen above."
  storage: "%size% of audience in the database. Kept day by day: the people %human% months, the suspected robots %suspect% months, the declared robots %declared% months; month by month after that."
  origin_intro: "Counted on the server, without cookies: a visitor is someone else the next day. Search engines rarely pass the keyword any more."
  robots_intro: "Every robot, counted apart from the people: declared by its user agent — crawlers, AI assistants —, or suspected — a browser's user agent without a browser's headers, reading in bursts or faster than a person. Their pages alone."

fr:
  page_title: Audience
  page_icon: ph:bold/chart-line-up
  section:
    now: En ce moment
    composition: Qui lit le site
    traffic: Dans le temps
    geography: Où sont les visiteurs
    origin: "D'où viennent les visites"
    pages: Pages
    robots: Robots
    api: API
  api_intro: "Les programmes et agents MCP qui appellent l'API, comptés à part des lecteurs : par route ou outil, appelant, statut, et selon que le cache a répondu."
  now_intro: "Toutes les pages lues ces dernières heures, quelles que soient la période et l'audience choisies plus bas."
  now:
    window_24h: 24 heures
    window_2h: 2 heures
  composition_intro: "Toutes les pages lues, le trafic brut : les personnes, les robots repérés sous un habit de navigateur, et les robots qui se nomment."
  people_only: "Les personnes seulement, quelle que soit l'audience choisie en haut."
  geography_intro: "La carte compte toutes les pages lues, robots compris ; le tableau à côté, l'audience choisie en haut."
  storage: "%size% d'audience en base. Gardé jour par jour : les personnes %human% mois, les robots suspectés %suspect% mois, les robots déclarés %declared% mois ; mois par mois au-delà."
  origin_intro: "Compté côté serveur, sans cookie : un visiteur devient quelqu'un d'autre le lendemain. Les moteurs de recherche ne transmettent presque plus le mot-clé."
  robots_intro: "Tous les robots, comptés à part des personnes : déclarés par leur user agent — moteurs, assistants IA —, ou suspectés — un user agent de navigateur sans les en-têtes d'un navigateur, lisant en rafale ou plus vite qu'une personne. Leurs pages seulement."

zh:
  page_title: 受众
  page_icon: 'ph:bold/chart-line-up'
  section:
    now: 现在
    composition: 谁在浏览网站
    traffic: 随着时间的推移
    geography: 访客的来源
    origin: 访问来自哪里
    pages: 页面
    robots: 机器人
    api: API
  api_intro: '调用 API 的程序和 MCP 代理，单独计数，按路由或工具、调用者、状态以及缓存是否响应进行分类。'
  now_intro: 过去几小时内阅读的每个页面，无论下面选择的时间段和受众。
  now:
    window_24h: '24 小时'
    window_2h: '2 小时'
  composition_intro: 每一页的浏览量：真实的流量，包括人类、伪装成浏览器的机器人，以及自称为机器人的那些。
  people_only: 仅限于人类，不论上面选择的受众是什么。
  geography_intro: 地图显示每个页面的阅读量，包括机器人；旁边的表格显示上述选择的受众。
  storage: 数据库中存储的受众数量为%size%。逐日保留：人类%human%个月，怀疑的机器人%suspect%个月，已声明的机器人%declared%个月；之后按月统计。
  origin_intro: '在服务器上计算，不使用 cookies：访客在第二天是另一个人。搜索引擎很少再传递关键词了。'
  robots_intro: 每一个机器人，单独计数，不包括人类：由其用户代理声明——爬虫、人工智能助手——或被怀疑——没有浏览器头的浏览器用户代理，以比人类更快的速度或间歇性地进行阅读。仅限其页面。

ar:
  page_title: الجمهور
  page_icon: 'ph:bold/chart-line-up'
  section:
    now: الآن
    composition: 'من يقرأ الموقع'
    traffic: 'على مر الزمن'
    geography: 'من أين يأتي الزوار'
    origin: 'من أين تأتي الزيارات'
    pages: الصفحات
    robots: الروبوتات
    api: API
  api_intro: 'البرامج ووكلاء MCP الذين يتصلون بالـ api، محسوبين بشكل منفصل عن القراء: حسب المسار أو الأداة، المتصل، الحالة، وما إذا كانت الذاكرة المؤقتة قد أجابت.'
  now_intro: 'كل صفحة تم قراءتها خلال الساعات الماضية، بغض النظر عن الفترة والجمهور المختار أدناه.'
  now:
    window_24h: '24 ساعة'
    window_2h: ساعتان
  composition_intro: 'كل صفحة مقروءة، الحركة الخام: الأشخاص، الروبوتات التي تم القبض عليها متنكرة كمتصفحات، والروبوتات التي تسمي نفسها.'
  people_only: 'الأشخاص فقط، بغض النظر عن الجمهور المختار أعلاه.'
  geography_intro: 'تحتسب الخريطة كل صفحة تمت قراءتها، بما في ذلك الروبوتات؛ الجدول بجانبها، الجمهور المختار أعلاه.'
  storage: '%size% من الجمهور في قاعدة البيانات. محفوظة يوماً بيوم: الأشخاص %human% شهراً، الروبوتات المشتبه بها %suspect% شهراً، الروبوتات المعلنة %declared% شهراً؛ شهراً بشهر بعد ذلك.'
  origin_intro: 'يتم العد على الخادم، بدون ملفات تعريف الارتباط: الزائر هو شخص آخر في اليوم التالي. نادرًا ما تمر محركات البحث بالكلمة الرئيسية بعد الآن.'
  robots_intro: 'كل روبوت، يُحتسب بشكل منفصل عن الأشخاص: مُعلن بواسطة وكيل المستخدم الخاص به — الزاحفون، مساعدو الذكاء الاصطناعي —، أو المشتبه بهم — وكيل مستخدم المتصفح بدون رؤوس المتصفح، يقرأ في دفعات أو أسرع من الشخص. صفحاتهم فقط.'

hi:
  page_title: दर्शक
  page_icon: 'ph:bold/chart-line-up'
  section:
    now: 'इस समय'
    composition: 'कौन साइट पढ़ता है'
    traffic: 'समय के साथ'
    geography: 'जहाँ आगंतुक हैं'
    origin: 'जहाँ से विज़िट आते हैं'
    pages: पृष्ठ
    robots: रोबोट्स
    api: API
  api_intro: 'प्रोग्राम और MCP एजेंट जो API को कॉल कर रहे हैं, पाठकों से अलग गिने जाते हैं: प्रति मार्ग या उपकरण, कॉलर, स्थिति, और क्या कैश ने उत्तर दिया।'
  now_intro: 'पिछले घंटों में पढ़े गए हर पृष्ठ, नीचे चुने गए अवधि और दर्शकों के बावजूद।'
  now:
    window_24h: '24 घंटे'
    window_2h: '2 घंटे'
  composition_intro: 'प्रत्येक पृष्ठ पढ़ा गया, कच्चा ट्रैफिक: लोग, वे रोबोट जो ब्राउज़र के रूप में पकड़े गए हैं, और वे रोबोट जो अपने आप को नामित करते हैं।'
  people_only: 'सिर्फ लोग, चाहे जो भी ऊपर चुना गया दर्शक हो।'
  geography_intro: 'मानचित्र हर पढ़े गए पृष्ठ को गिनता है, रोबोटों सहित; इसके बगल की तालिका, ऊपर चुने गए दर्शकों को दर्शाती है।'
  storage: '%size% दर्शक डेटाबेस में। दिन-प्रतिदिन रखा गया: लोग %human% महीने, संदेहास्पद रोबोट %suspect% महीने, घोषित रोबोट %declared% महीने; उसके बाद महीने दर महीने।'
  origin_intro: 'सर्वर पर गिने गए, बिना कुकीज़ के: एक आगंतुक अगले दिन कोई और होता है। सर्च इंजन अब अक्सर कीवर्ड पास नहीं करते।'
  robots_intro: 'प्रत्येक रोबोट, लोगों से अलग गिना गया: इसके उपयोगकर्ता एजेंट द्वारा घोषित — क्रॉलर, एआई सहायक —, या संदेहास्पद — किसी ब्राउज़र के हेडर के बिना एक ब्राउज़र का उपयोगकर्ता एजेंट, जो एक व्यक्ति से तेज़ी से या झोंकों में पढ़ रहा है। केवल उनके पृष्ठ।'

he:
