    api: API
  api_intro: 'התוכניות וסוכני ה-MCP שמתקשרים ל-api, נחשבים בנפרד מהקוראים: לפי נתיב או כלי, מתקשר, סטטוס, ואם המטמון ענה.'
  now_intro: 'כל עמוד שנקרא בשעות האחרונות, ללא קשר לתקופה ולקהל שנבחר למטה.'
  now:
    window_24h: '24 שעות'
    window_2h: '2 שעות'
  composition_intro: 'כל עמוד נקרא, התנועה הגולמית: האנשים, הרובוטים שנתפסו מחופשים לדפדפנים, והרובוטים שמציינים את עצמם.'
  people_only: 'רק האנשים, כלשהם הקהל הנבחר לעיל.'
  geography_intro: 'המפה סופרת כל עמוד שנקרא, רובוטים בפנים; הטבלה לצידה, הקהל שנבחר למעלה.'
  storage: '%size% מהקהל בבסיס הנתונים. נשמר יום יום: האנשים %human% חודשים, הרובוטים החשודים %suspect% חודשים, הרובוטים המוצהרים %declared% חודשים; חודש אחרי חודש לאחר מכן.'
  origin_intro: 'נספר על השרת, בלי עוגיות: מבקר הוא מישהו אחר ביום למחרת. מנועי חיפוש rarely מעבירים את המילה המפתח עוד.'
  robots_intro: 'כל רובוט, נחשב בנפרד מהאנשים: המוצהרים על ידי סוכן המשתמש שלהם — זחלים, עוזרי AI —, או החשודים — סוכן משתמש של דפדפן ללא כותרות דפדפן, קוראים במתקפות או מהר יותר מאדם. העמודים שלהם בלבד.'

fa:
  page_title: مخاطب
