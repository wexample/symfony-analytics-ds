  robots_intro: 'Các công cụ thu thập dữ liệu và trợ lý AI, được tính riêng biệt với người dùng: số trang đã đọc theo robot, được đặt tên theo tác nhân người dùng của nó, hoặc bị bắt gặp đọc nhanh hơn một người.'

