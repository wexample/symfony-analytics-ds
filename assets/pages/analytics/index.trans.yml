    origin: 'যেখানে ভিজিটগুলো আসে'
    pages: পেজগুলো
    robots: রোবট
  origin_intro: 'সার্ভারে গণনা করা হয়, কুকি ছাড়া: একজন দর্শক পরের দিন অন্য কেউ। সার্চ ইঞ্জিনগুলো আর কমই কীওয়ার্ডটি পাঠায়।'
  robots_intro: 'ক্রলারে এবং AI সহকারী, দর্শকের থেকে আলাদা গণনা করা: প্রতিটি রোবট দ্বারা পড়া পৃষ্ঠা, যার নাম তার ব্যবহারকারী এজেন্ট দ্বারা, অথবা একজন মানুষের চেয়ে দ্রুত পড়তে ধরা পড়েছে।'

th:
